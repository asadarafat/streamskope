name: Native recovery

on:
  workflow_dispatch:
    inputs:
      from_version:
        description: Published desktop version to upgrade from (without v)
        required: true
        type: string
      to_version:
        description: Target published version (only for published-release mode, without v)
        required: false
        type: string
      target:
        description: Build the current source or test an existing published installer
        required: true
        type: choice
        default: current-source
        options: [current-source, published-release]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  recovery:
    name: Recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ inputs.target == 'published-release' && '1' || '' }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RECOVERY_FROM: ${{ inputs.from_version }}
      RECOVERY_TO: ${{ inputs.to_version }}
      STREAMSKOPE_TEST_KAFKA_ENDPOINT: ${{ vars.STREAMSKOPE_TEST_KAFKA_ENDPOINT }}
      STREAMSKOPE_TEST_OAUTH_ENDPOINT: ${{ vars.STREAMSKOPE_TEST_OAUTH_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure the shared remote AIO fixture
        env:
          STREAMSKOPE_TEST_CA_PEM: ${{ vars.STREAMSKOPE_TEST_CA_PEM }}
        run: |
          node --input-type=module <<'NODE'
          import { X509Certificate } from 'node:crypto';
          import { writeFile, appendFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const { STREAMSKOPE_TEST_KAFKA_ENDPOINT, STREAMSKOPE_TEST_OAUTH_ENDPOINT, STREAMSKOPE_TEST_CA_PEM, RUNNER_TEMP, GITHUB_ENV } = process.env;
          if (![STREAMSKOPE_TEST_KAFKA_ENDPOINT, STREAMSKOPE_TEST_OAUTH_ENDPOINT, STREAMSKOPE_TEST_CA_PEM, RUNNER_TEMP, GITHUB_ENV].every(value => value?.trim())) {
            throw new Error('Configure shared AIO repository variables: STREAMSKOPE_TEST_KAFKA_ENDPOINT, STREAMSKOPE_TEST_OAUTH_ENDPOINT and STREAMSKOPE_TEST_CA_PEM. The fixture must be reachable from every native runner.');
          }
          try { new X509Certificate(STREAMSKOPE_TEST_CA_PEM); }
          catch { throw new Error('STREAMSKOPE_TEST_CA_PEM must contain the AIO public PEM certificate.'); }
          const ca = join(RUNNER_TEMP, 'streamskope-aio-ca.pem');
          if (/[\r\n]/u.test(ca)) throw new Error('Invalid runner temporary directory.');
          await writeFile(ca, STREAMSKOPE_TEST_CA_PEM, { mode: 0o600, flag: 'wx' });
          await appendFile(GITHUB_ENV, `STREAMSKOPE_TEST_CA_PATH=${ca}\n`);
          NODE
      - name: Install Linux desktop credential service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dbus-x11 gnome-keyring libsecret-1-0 xvfb
          npx --no-install playwright install-deps chromium
      - name: Prepare disposable macOS Keychain
        if: runner.os == 'macOS'
        run: |
          keychain_password=$(openssl rand -hex 32)
          keychain_path="$RUNNER_TEMP/streamskope-recovery.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
      - name: Replace released installer and verify protected recovery
        if: inputs.target == 'published-release'
        run: node --import tsx tools/check/native-recovery.ts --from "$RECOVERY_FROM" --to "$RECOVERY_TO"
      - name: Build source installer and verify protected upgrade recovery
        if: inputs.target == 'current-source'
        run: |
          candidate=$(node --import tsx -e 'process.stdout.write("dist/installers/" + require("./tools/check/native-installers.ts").installerName("0.0.0-dev"))')
          node --import tsx tools/check/native-recovery.ts --from "$RECOVERY_FROM" --candidate "$candidate" --candidate-version 0.0.0-dev
      - name: Remove disposable macOS Keychain
        if: always() && runner.os == 'macOS'
        run: |
          keychain_path="$RUNNER_TEMP/streamskope-recovery.keychain-db"
          if [[ -f "$keychain_path" ]]; then security delete-keychain "$keychain_path"; fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: native-recovery-${{ runner.os }}-${{ runner.arch }}
          path: dist/native-recovery/*.json
          if-no-files-found: warn
          retention-days: 90
