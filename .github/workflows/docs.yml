name: Pages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # Plugin archival must never replace a queued desktop Pages publication.
  group: pages-${{ startsWith(github.event.release.tag_name, 'v') && 'desktop' || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  records:
    name: Synchronize release records or hand off
    if: github.event_name == 'release' && !github.event.release.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: release-documentation
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Select release documentation credentials
        id: credentials
        env:
          APP_CLIENT_ID: ${{ vars.STREAMSKOPE_RELEASE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.STREAMSKOPE_RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "use_app=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$APP_CLIENT_ID" && -z "$APP_PRIVATE_KEY" ]]; then
            echo "use_app=false" >> "$GITHUB_OUTPUT"
          else
            echo "Configure both the release App client ID and private key, or neither." >&2
            exit 1
          fi
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.credentials.outputs.use_app == 'true'
        id: app
        with:
          client-id: ${{ vars.STREAMSKOPE_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STREAMSKOPE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # Archival advances main; deployment below remains pinned to the release.
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Synchronize records and report completion or handoff
        id: records
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          RELEASE_DOCS_AUTOMATIC_CI: ${{ steps.credentials.outputs.use_app }}
        run: node --import tsx tools/package/release-documentation.ts reconcile

  select:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
      - id: release
        name: Select the latest immutable stable desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/docs.py guard

  build:
    needs: select
    if: needs.select.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      STREAMSKOPE_DOCS_URL: https://asadarafat.github.io/streamskope/
      STREAMSKOPE_DOCS_PUBLISH: "1"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      release: ${{ steps.identity.outputs.release }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # The release event SHA is the tagged source, even if main has advanced.
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: npm ci --no-audit --no-fund
      - name: Prepare documentation for the published desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --import tsx tools/package/release-version.ts desktop "${RELEASE_TAG#v}" --stamp
          npm run docs -- prepare
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run docs -- qualify
      - id: identity
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          identity = json.loads(Path("dist/site/documentation.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={identity['revision']}\nrelease={identity['desktop_release']}\n")
          PY
      - name: Verify documented desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/docs/downloads.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.build.outputs.revision }}
      - name: Recheck the release immediately before deployment
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/docs.py guard
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        if: steps.release.outputs.publish == 'true'
        id: deployment
      - name: Verify published documentation
        if: steps.release.outputs.publish == 'true'
        env:
          DOCS_URL: ${{ steps.deployment.outputs.page_url }}
          DOCS_REVISION: ${{ needs.build.outputs.revision }}
          DOCS_RELEASE: ${{ needs.build.outputs.release }}
        run: python3 tools/docs.py verify --url "$DOCS_URL" --revision "$DOCS_REVISION" --release "$DOCS_RELEASE"
