name: Documentation

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.12.0
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium firefox
      - name: Qualify the exact Pages artifact using the local entrypoint
        env:
          SITE_OVERRIDE: ${{ vars.STREAMSKOPE_DOCS_URL }}
        run: |
          if [ -n "$SITE_OVERRIDE" ]; then
            export STREAMSKOPE_DOCS_URL="$SITE_OVERRIDE"
          elif [ "${GITHUB_REPOSITORY#*/}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            export STREAMSKOPE_DOCS_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/"
          else
            export STREAMSKOPE_DOCS_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          npm run ci:docs
      - name: Upload reviewable site and browser evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: documentation-preview
          path: |
            dist/site
            .artifacts/website
          include-hidden-files: true
          retention-days: 7
      - name: Upload qualified Pages artifact
        if: github.event_name == 'release'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist/site

  deploy:
    needs: qualify
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the qualified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  hosted-smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium firefox
      - name: Exercise the deployed site with the same browser checks
        env:
          SITE_URL: ${{ needs.deploy.outputs.url }}
        run: npm run docs:smoke -- --url "$SITE_URL"
