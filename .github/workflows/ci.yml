name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  STREAMSKOPE_DOCS_URL: https://asadarafat.github.io/streamskope/

jobs:
  shared:
    name: Static, unit and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.24.0
          cache-dependency-path: vendors/streamskope/apps/capture/agent/go.mod
      - run: npm ci --no-audit --no-fund
      # Shared integration tests also exercise real browser plugin installation.
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check -- --ci --lane shared
      - name: Stage evidence with repository-relative paths
        if: ${{ !cancelled() }}
        run: node tools/check/ci-evidence.ts stage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: qualification-shared
          path: ${{ runner.temp }}/qualification
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check -- --ci --lane docs
      - name: Stage evidence with repository-relative paths
        if: ${{ !cancelled() }}
        run: node tools/check/ci-evidence.ts stage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: qualification-docs
          path: ${{ runner.temp }}/qualification
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  runtime:
    name: Real providers and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check -- --ci --lane runtime
      - name: Stage evidence with repository-relative paths
        if: ${{ !cancelled() }}
        run: node tools/check/ci-evidence.ts stage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: qualification-runtime
          path: ${{ runner.temp }}/qualification
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  checks:
    name: CI
    needs: [shared, docs, runtime]
    # A skipped required check is accepted by GitHub; cancellation must fail this gate.
    if: ${{ always() }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject cancelled qualification
        if: ${{ always() && (cancelled() || contains(needs.*.result, 'cancelled')) }}
        run: |
          echo "Qualification was cancelled; every lane must finish successfully." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() }}
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: ${{ !cancelled() }}
        with:
          pattern: qualification-*
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Require every lane and collect source-bound evidence
        if: ${{ !cancelled() }}
        env:
          STREAMSKOPE_CI_RESULTS: ${{ toJSON(needs) }}
        run: node tools/check/ci-evidence.ts aggregate
      - name: Stage evidence with repository-relative paths
        if: ${{ !cancelled() }}
        run: node tools/check/ci-evidence.ts stage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: qualification
          path: ${{ runner.temp }}/qualification
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
