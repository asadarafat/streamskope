name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: CI
    runs-on: ubuntu-24.04
    # PR11 took about 12.5 minutes before the real NATS workspace scenarios.
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      STREAMSKOPE_DOCS_URL: https://asadarafat.github.io/streamskope/
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.12.0
          cache: npm
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.24.0
          cache-dependency-path: vendors/streamskope/apps/capture/agent/go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check -- --ci
      - name: Verify real Kafka collection, replication recovery and final-client cleanup
        run: npx --no-install vitest run --config config/vitest.config.ts --maxWorkers=1 --outputFile=.artifacts/ci/observations-real.json test/kafka/observations-real.test.ts test/kafka/observation-replication-real.test.ts test/kafka/provider-stream-stop-real.test.ts
      - name: Verify Core NATS token, TLS and subscription lifecycle
        run: npx --no-install vitest run --config config/vitest.config.ts --maxWorkers=1 --outputFile=.artifacts/ci/nats-real.json test/nats/provider-real.test.ts
      - name: Verify workbench and monitoring browser workflows
        run: >-
          node tools/package/e2e.mjs web
          test/e2e/web-stream-monitor.spec.ts
          test/e2e/web-observations-recovery.spec.ts
          test/e2e/web-responsive-workbench.spec.ts
          --grep 'keyboard-operable|investigates real lag|persistent resource hierarchy|expanded dock in both themes|main resource page primary'
      - name: Verify Core NATS live workspace and provider switching in Chromium
        run: node tools/package/e2e.mjs web test/e2e/web-nats-workspace.spec.ts
      - name: Verify hot plugin lifecycle and local management during catalog failure
        run: node tools/package/e2e.mjs web test/e2e/web-plugin-installation.spec.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: qualification
          path: |
            .artifacts/ci/vitest.json
            .artifacts/ci/observations-real.json
            .artifacts/ci/nats-real.json
            .artifacts/website
            test-results/web
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
