version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # Restrict routine version proposals; security updates retain major-version fixes.
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      routine-tooling:
        applies-to: version-updates
        dependency-type: development
        patterns: ["@types/node", typescript-eslint, prettier]
        update-types: [minor, patch]
      vitest-family:
        applies-to: version-updates
        dependency-type: development
        patterns: [vitest, "@vitest/*"]
        update-types: [minor, patch]
      ui-framework:
        applies-to: version-updates
        dependency-type: development
        patterns: [react, react-dom, "@types/react", "@types/react-dom", "@mui/*", "@emotion/*"]
        update-types: [minor, patch]
      browser-testing:
        applies-to: version-updates
        dependency-type: development
        patterns: ["@playwright/*", playwright, "@axe-core/*", "@testing-library/*", jsdom]
        update-types: [minor, patch]
      native-packaging:
        applies-to: version-updates
        dependency-type: development
        patterns: [electron, electron-builder, "@electron/*"]
        update-types: [minor, patch]
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns:
          - node-forge
          - "@nats-io/transport-node"
          - braces
          - http-cache-semantics
          - handlebars
      build-and-lint:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
        exclude-patterns:
          - node-forge
          - "@nats-io/transport-node"
          - braces
          - http-cache-semantics
          - handlebars
  - package-ecosystem: npm
    directory: /website/promo
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      promotional-tooling:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      workflow-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /website
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      docs-toolchain:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /aio-kafka/images/oauth-service
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      oauth-fixture:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /vendors/streamskope/apps/capture/agent
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
