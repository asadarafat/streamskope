[project]
site_name = "StreamSkope"
site_description = "Get started with StreamSkope: connect Kafka or NATS, inspect records and troubleshoot connections."
site_url = "http://127.0.0.1:8002/"
repo_url = "https://github.com/asadarafat/streamskope"
repo_name = "asadarafat/streamskope"
docs_dir = "docs"
site_dir = ".site"
copyright = "StreamSkope contributors · Apache-2.0"
extra_css = ["assets/site.css"]
extra_javascript = ["assets/navigation.js", "assets/theme-images.js", "assets/search-accessibility.js"]
nav = [
  { "Home" = "index.md" },
  { "Start here" = [
    { "Install StreamSkope" = "start/installation.md" },
    { "Install the browser workbench" = "start/containerlab.md" },
    { "Read your first message" = "start/quickstart.md" }
  ] },
  { "Everyday tasks" = [
    { "Everyday tasks" = "guide/index.md" },
    { "Connect to Kafka or NATS" = "start/connections.md" },
    { "Read Kafka messages" = "guide/messages.md" },
    { "Read NATS subjects" = "guide/core-nats.md" }
  ] },
  { "Under the Skope" = [
    { "Under the Skope" = "skope/index.md" },
    { "Find a missing or delayed event" = "skope/missing-event.md" },
    { "Understand a changed payload" = "skope/changed-payload.md" },
    { "Diagnose Kafka health" = "guide/observed-health.md" },
    { "Inspect an EDA export" = "skope/eda-export.md" },
    { "Follow an NSP notification" = "skope/nsp-notification.md" },
    { "Review and replay a failed record" = "skope/replay-record.md" },
    { "Recover consumer positions" = "guide/offset-recovery.md" },
    { "Compare environments" = "guide/environment-comparison.md" },
    { "Assess relationships and schema impact" = "guide/relationships.md" },
    { "Fix a connection or reading problem" = "guide/troubleshooting.md" },
    { "Share your findings" = "skope/share-findings.md" }
  ] },
  { "Plugins" = [
    { "Overview and lifecycle" = "plugins/index.md" },
    { "Install without GitHub" = "plugins/offline.md" },
    { "Versioning and compatibility" = "plugins/versioning.md" },
    { "EDA Connector" = "plugins/eda.md" },
    { "NSP Connector" = "plugins/nsp.md" }
  ] },
  { "Concepts" = [
    { "Records, decoding and original bytes" = "concepts/records.md" },
    { "Search coverage and evidence" = "concepts/evidence.md" },
    { "Connections and capture lifecycles" = "concepts/connections.md" }
  ] },
  { "Reference" = [
    { "Find settings and limits" = "reference/index.md" },
    { "Compatibility" = "start/compatibility.md" },
    { "Record formats and decoding limits" = "reference/record-formats.md" },
    { "Replay behavior and limits" = "reference/replay.md" },
    { "Authentication and certificate trust" = "reference/connection-security.md" },
    { "Permissions and security" = "guide/security.md" },
    { "Data, exports and storage" = "guide/data-handling.md" },
    { "Qualification evidence" = "guide/qualification.md" }
  ] },
  { "Releases" = "releases/index.md" },
  { "About" = "about.md" }
]

[project.theme]
custom_dir = "overrides"
language = "en"
logo = "assets/streamskope.svg"
favicon = "assets/streamskope.svg"
features = ["navigation.top", "navigation.path", "navigation.indexes", "content.code.copy", "search.highlight"]
font = false

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.toc]
permalink = true

[project.extra]
generator = false
desktop_release = "v0.11.2"
