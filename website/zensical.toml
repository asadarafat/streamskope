[project]
site_name = "StreamSkope"
site_description = "Get started with StreamSkope: connect Kafka, inspect messages and check consumer lag."
site_url = "http://127.0.0.1:8002/"
docs_dir = "docs"
site_dir = ".site"
copyright = "StreamSkope contributors · Apache-2.0"
extra_css = ["assets/site.css"]
extra_javascript = ["assets/navigation.js", "assets/theme-images.js", "assets/search-accessibility.js"]
nav = [
  { "Home" = "index.md" },
  { "Start here" = [
    { "Install StreamSkope" = "start/installation.md" },
    { "Check compatibility" = "start/compatibility.md" },
    { "Read your first message" = "start/quickstart.md" },
    { "Connect your Kafka" = "guide/connections.md" }
  ] },
  { "Everyday tasks" = [
    { "Find and inspect a message" = "guide/messages.md" },
    { "Decode a structured record" = "guide/structured-events.md" },
    { "Check consumer lag" = "guide/operations.md" },
    { "Observe Kafka health" = "guide/observed-health.md" },
    { "Trace relationships and schema impact" = "guide/relationships.md" },
    { "Inspect a schema" = "guide/schema-registry.md" },
    { "Troubleshoot a problem" = "guide/troubleshooting.md" }
  ] },
  { "Plugins" = [
    { "Plugin overview" = "plugins/index.md" },
    { "Versioning and compatibility" = "plugins/versioning.md" },
    { "EDA Capture" = "plugins/eda.md" },
    { "NSP Capture" = "plugins/nsp.md" }
  ] },
  { "Operate safely" = [
    { "Reset consumer offsets" = "guide/offset-recovery.md" },
    { "Copy or replay records" = "guide/record-replay.md" },
    { "Manage Kafka Connect" = "guide/kafka-connect.md" },
    { "Compare environments" = "guide/environment-comparison.md" },
    { "Change topic configuration" = "guide/topic-configuration.md" },
    { "Run a latency probe" = "guide/latency.md" },
    { "Configure certificate trust" = "guide/tls-trust.md" },
    { "Review topic access and ACLs" = "guide/access-review.md" },
    { "Security and permissions" = "guide/security.md" },
    { "Upgrade, back up and recover" = "guide/recovery.md" },
    { "Data, exports and limits" = "guide/data-handling.md" },
    { "Qualification evidence" = "guide/qualification.md" }
  ] },
  { "Advanced" = [
    { "Reuse connection secrets" = "guide/secret-retrieval.md" },
    { "Inspect access and transforms" = "guide/governance.md" },
    { "Run a consumer sandbox" = "guide/developer-sandbox.md" },
    { "Inspect and export with the CLI" = "guide/read-only-cli.md" },
    { "Generate a schema client" = "guide/schema-clients.md" },
    { "Source workbench" = "start/development.md" }
  ] },
  { "Releases" = "releases/index.md" },
  { "About" = "about.md" }
]

[project.theme]
custom_dir = "overrides"
language = "en"
logo = "assets/streamskope.svg"
favicon = "assets/streamskope.svg"
features = ["navigation.top", "navigation.path", "content.code.copy", "search.highlight"]
font = false

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.toc]
permalink = true

[project.extra]
generator = false
desktop_release = "v0.7.1"
