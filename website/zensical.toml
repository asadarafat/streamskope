[project]
site_name = "StreamSkope"
site_description = "Get started with StreamSkope: connect Kafka, inspect messages and check consumer lag."
site_url = "http://127.0.0.1:8002/"
docs_dir = "docs"
site_dir = ".site"
copyright = "StreamSkope contributors · Apache-2.0"
extra_css = ["assets/site.css"]
extra_javascript = ["assets/navigation.js"]
nav = [
  { "Home" = "index.md" },
  { "Start here" = [
    { "Read your first message" = "start/quickstart.md" },
    { "Connect your Kafka" = "guide/connections.md" },
    { "Install StreamSkope" = "start/installation.md" }
  ] },
  { "Everyday tasks" = [
    { "Find and inspect a message" = "guide/messages.md" },
    { "Check consumer lag" = "guide/operations.md" },
    { "Inspect a schema" = "guide/schema-registry.md" },
    { "Troubleshoot a problem" = "guide/troubleshooting.md" }
  ] },
  { "Advanced" = [
    { "Reuse connection secrets" = "guide/secret-retrieval.md" },
    { "Inspect access and transforms" = "guide/governance.md" }
  ] },
  { "About" = "about.md" }
]

[project.theme]
custom_dir = "overrides"
language = "en"
logo = "assets/streamskope.svg"
favicon = "assets/streamskope.svg"
features = ["navigation.top", "content.code.copy", "search.highlight"]
font = false

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.toc]
permalink = true

[project.extra]
generator = false
