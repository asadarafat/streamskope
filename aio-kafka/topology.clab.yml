# Containerlab topology for StreamSkope's isolated Kafka validation fixture.
name: ${STREAMSKOPE_FIXTURE_NAME}

topology:
  nodes:
    broker:
      kind: linux
      image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
      entrypoint: /entrypoint.sh
      stages:
        create:
          wait-for:
            - node: oauth
              stage: healthy
      env:
        ADVERTISED_HOST: "localhost"
        ADVERTISED_PORT: "${STREAMSKOPE_KAFKA_PORT}"
        INTERNAL_HOST: "clab-${STREAMSKOPE_FIXTURE_NAME}-broker"
        OAUTH_HOST: "clab-${STREAMSKOPE_FIXTURE_NAME}-oauth"
        OAUTH_CLIENT_ID: "${STREAMSKOPE_OAUTH_CLIENT_ID}"
        OAUTH_CLIENT_SECRET: "${STREAMSKOPE_OAUTH_CLIENT_SECRET}"
        OAUTH_EXPECTED_AUDIENCE: "${STREAMSKOPE_SCHEMA_REGISTRY_AUDIENCE}"
        OAUTH_EXPECTED_ISSUER: "${STREAMSKOPE_OAUTH_ISSUER}"
        KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
        PRODUCER_ENABLED: "false"
        PRODUCER_TOPIC: "${STREAMSKOPE_TOPIC}"
        KAFKA_OPTS: "-Dorg.apache.kafka.sasl.oauthbearer.allowed.urls=http://clab-${STREAMSKOPE_FIXTURE_NAME}-oauth:5000/rest-gateway/rest/api/v1/auth/token,http://clab-${STREAMSKOPE_FIXTURE_NAME}-oauth:5000/.well-known/jwks.json -Djava.security.auth.login.config=/opt/kafka/config/jaas.conf"
      ports:
        - "${STREAMSKOPE_KAFKA_PORT}:9093/tcp"
      binds:
        # Entrypoint
        - ./config/kafka-broker/entrypoint.sh:/entrypoint.sh:ro
        # Kafka configs and certs
        - ./config/kafka-broker/jaas.conf:/opt/kafka/config/jaas.conf:ro
        - ./config/kafka-broker/server.properties:/opt/kafka/server.properties:ro
        - ${STREAMSKOPE_CERT_DIR}:/opt/kafka/config/certs:ro
      healthcheck:
        start-period: 10
        interval: 10
        timeout: 2
        retries: 6
        test:
          - CMD
          - awk
          - '$2 ~ /:2384$/ && $4 == "0A" { found=1 } END { exit !found }'
          - /proc/net/tcp
          - /proc/net/tcp6
    oauth:
      kind: linux
      image: ${STREAMSKOPE_OAUTH_IMAGE}
      env:
        OAUTH_CLIENT_ID: "${STREAMSKOPE_OAUTH_CLIENT_ID}"
        OAUTH_CLIENT_SECRET: "${STREAMSKOPE_OAUTH_CLIENT_SECRET}"
        OAUTH_ISSUER: "${STREAMSKOPE_OAUTH_ISSUER}"
        OAUTH_SCOPE: "${STREAMSKOPE_OAUTH_SCOPE}"
        SCHEMA_REGISTRY_AUDIENCE: "${STREAMSKOPE_SCHEMA_REGISTRY_AUDIENCE}"
        SCHEMA_REGISTRY_ROLE: "${STREAMSKOPE_SCHEMA_REGISTRY_ROLE}"
      ports:
        - "${STREAMSKOPE_OAUTH_PORT}:5000/tcp"
      healthcheck:
        start-period: 3
        interval: 10
        timeout: 2
        retries: 6
        test:
          - CMD
          - awk
          - '$2 ~ /:1388$/ && $4 == "0A" { found=1 } END { exit !found }'
          - /proc/net/tcp
          - /proc/net/tcp6
    schema-registry:
      kind: linux
      image: ${STREAMSKOPE_SCHEMA_REGISTRY_IMAGE}
      entrypoint: python3 -m karapace
      stages:
        create:
          wait-for:
            - node: broker
              stage: healthy
      env:
        KARAPACE_ADVERTISED_HOSTNAME: "clab-${STREAMSKOPE_FIXTURE_NAME}-schema-registry"
        KARAPACE_ADVERTISED_PROTOCOL: "http"
        KARAPACE_BOOTSTRAP_URI: "clab-${STREAMSKOPE_FIXTURE_NAME}-broker:9095"
        KARAPACE_CLIENT_ID: "streamskope-schema-registry"
        KARAPACE_COMPATIBILITY: "BACKWARD"
        KARAPACE_GROUP_ID: "streamskope-schema-registry"
        KARAPACE_HOST: "0.0.0.0"
        KARAPACE_KAFKA_SCHEMA_READER_STRICT_MODE: "false"
        KARAPACE_KARAPACE_REGISTRY: "true"
        KARAPACE_KARAPACE_REST: "false"
        KARAPACE_LOG_LEVEL: "INFO"
        KARAPACE_MASTER_ELIGIBILITY: "true"
        KARAPACE_PORT: "8081"
        KARAPACE_REPLICATION_FACTOR: "1"
        KARAPACE_SASL_OAUTHBEARER_AUTHORIZATION_ENABLED: "true"
        KARAPACE_SASL_OAUTHBEARER_CLIENT_ID: "${STREAMSKOPE_SCHEMA_REGISTRY_AUDIENCE}"
        KARAPACE_SASL_OAUTHBEARER_EXPECTED_AUDIENCE: "${STREAMSKOPE_SCHEMA_REGISTRY_AUDIENCE}"
        KARAPACE_SASL_OAUTHBEARER_EXPECTED_ISSUER: "${STREAMSKOPE_OAUTH_ISSUER}"
        KARAPACE_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL: "${STREAMSKOPE_OAUTH_ISSUER}/.well-known/jwks.json"
        KARAPACE_SASL_OAUTHBEARER_METHOD_ROLES: '{"GET":["${STREAMSKOPE_SCHEMA_REGISTRY_ROLE}"],"POST":["${STREAMSKOPE_SCHEMA_REGISTRY_ROLE}"],"PUT":["${STREAMSKOPE_SCHEMA_REGISTRY_ROLE}"],"DELETE":["${STREAMSKOPE_SCHEMA_REGISTRY_ROLE}"]}'
        KARAPACE_SASL_OAUTHBEARER_ROLES_CLAIM_PATH: "roles"
        KARAPACE_SECURITY_PROTOCOL: "PLAINTEXT"
        KARAPACE_TOPIC_NAME: "_schemas"
      ports:
        - "${STREAMSKOPE_SCHEMA_REGISTRY_PORT}:8081/tcp"
      healthcheck:
        start-period: 10
        interval: 10
        timeout: 2
        retries: 6
        test:
          - CMD
          - awk
          - '$2 ~ /:1F91$/ && $4 == "0A" { found=1 } END { exit !found }'
          - /proc/net/tcp
          - /proc/net/tcp6
