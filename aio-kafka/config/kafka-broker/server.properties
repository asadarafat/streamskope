# Minimal single-node KRaft config + SSL listener (SASL/OAUTH can be enabled as needed)

# KRaft (no ZooKeeper)
process.roles=broker,controller
node.id=1
controller.listener.names=CONTROLLER
controller.quorum.voters=1@localhost:9094
log.dirs=/var/lib/kafka/data

# Listeners
listeners=INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094,REGISTRY://:9095
advertised.listeners=INTERNAL://${INTERNAL_HOST}:9092,EXTERNAL://${ADVERTISED_HOST}:${ADVERTISED_PORT},REGISTRY://${INTERNAL_HOST}:9095
listener.security.protocol.map=INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL,CONTROLLER:PLAINTEXT,REGISTRY:PLAINTEXT
inter.broker.listener.name=INTERNAL

# SSL keystore/truststore
ssl.keystore.location=/opt/kafka/config/certs/kafka.keystore.jks
ssl.truststore.location=/opt/kafka/config/certs/kafka.truststore.jks
ssl.keystore.password=password
ssl.truststore.password=password
ssl.key.password=password

# Broker basics
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
num.partitions=1
num.recovery.threads.per.data.dir=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=true

# Enable SASL OAUTHBEARER on both secure listeners
sasl.enabled.mechanisms=OAUTHBEARER
listener.name.internal.sasl.enabled.mechanisms=OAUTHBEARER
listener.name.external.sasl.enabled.mechanisms=OAUTHBEARER
sasl.mechanism.inter.broker.protocol=OAUTHBEARER

# Server-side validator via JWKS (accept HS256 tokens using shared secret published by OAuth sidecar)
listener.name.internal.oauthbearer.sasl.server.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler
listener.name.external.oauthbearer.sasl.server.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler
sasl.oauthbearer.jwks.endpoint.url=http://${OAUTH_HOST}:5000/.well-known/jwks.json
sasl.oauthbearer.expected.audience=${OAUTH_EXPECTED_AUDIENCE}
sasl.oauthbearer.expected.issuer=${OAUTH_EXPECTED_ISSUER}
listener.name.sasl_ssl.oauthbearer.scope.claim.name=scope
listener.name.sasl_ssl.oauthbearer.subject.claim.name=sub
