apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: capturesessions.capture.streamskope.io
spec:
  group: capture.streamskope.io
  names:
    kind: CaptureSession
    listKind: CaptureSessionList
    plural: capturesessions
    singular: capturesession
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [leaseExpiresAt, leaseSeconds, localPort, source]
              properties:
                leaseExpiresAt:
                  type: string
                  format: date-time
                leaseSeconds:
                  type: integer
                  minimum: 30
                  maximum: 900
                localPort:
                  type: integer
                  minimum: 1024
                  maximum: 65535
                source:
                  type: object
                  required: [apiVersion, kind, name, namespace]
                  properties:
                    apiVersion:
                      type: string
                      enum: [kafka.eda.nokia.com/v1, kafka.eda.nokia.com/v1alpha1]
                    kind:
                      type: string
                      enum: [Producer, ClusterProducer]
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                    namespace:
                      type: string
                      minLength: 1
                      maxLength: 63
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Ready, Failed, Stopping]
                reason:
                  type: string
                  maxLength: 512
      subresources:
        status: {}
