apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamskope-capture-agent
  namespace: eda-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: streamskope-capture-agent
rules:
  - apiGroups: [capture.streamskope.io]
    resources: [capturesessions]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [capture.streamskope.io]
    resources: [capturesessions/status]
    verbs: [get, patch, update]
  - apiGroups: [kafka.eda.nokia.com]
    resources: [producers, clusterproducers]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, patch, delete]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: streamskope-capture-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: streamskope-capture-agent
subjects:
  - kind: ServiceAccount
    name: streamskope-capture-agent
    namespace: eda-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamskope-capture-agent
  namespace: eda-system
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streamskope-capture-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamskope-capture-agent
    spec:
      serviceAccountName: streamskope-capture-agent
      automountServiceAccountToken: true
      containers:
        - name: agent
          image: streamskope-capture-agent
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 25m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 96Mi
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: streamskope-capture-agent
  namespace: eda-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: streamskope-capture-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: core.eda.nokia.com/v1
kind: HttpProxy
metadata:
  name: streamskope-capture
  namespace: eda-system
spec:
  rootUrl: http://streamskope-capture-agent.eda-system.svc:8080/
  authType: inApiServer
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: streamskope-capture-agent
  namespace: eda-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: streamskope-capture-agent
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
